<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sites admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>site-publisher <span>admin</span></h1>
    <span id="who"></span>
    <button id="logout" hidden>Log out</button>
  </header>

  <section id="login" hidden>
    <p>Log in to publish pages</p>
    <div id="providers"></div>
  </section>
  <p id="denied" hidden></p>

  <main id="app" hidden>
    <form id="upload">
      <label id="drop" for="pick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <strong>Drop a folder, a .zip or an .html file</strong>
        <small>or click to choose a file</small>
        <input id="pick" type="file" accept=".zip,.html,.htm">
      </label>
      <div class="actions">
        <button type="button" id="pick-dir">Choose a folder…</button>
        <input id="pick-dir-input" type="file" webkitdirectory hidden>
        <p id="chosen"></p>
      </div>
      <label class="field" for="name">Page name
        <input id="name" required pattern="[a-z0-9]([a-z0-9\-]{0,61}[a-z0-9])?" placeholder="my-page" autocomplete="off" autocapitalize="none" spellcheck="false">
      </label>
      <span id="preview"></span>
      <div class="publish-row">
        <button id="publish" disabled>Publish</button>
        <p id="status" role="status"></p>
      </div>
    </form>

    <section id="list">
      <h2>Your pages</h2>
      <div id="tag-filter" role="group" aria-label="Filter by tag" hidden>
        <span>Filter</span>
        <div id="tag-chips"></div>
      </div>
      <table>
        <thead><tr>
          <th data-key="name" aria-sort="ascending"><button type="button" class="sort">Page</button></th>
          <th>Tags</th>
          <th data-key="bytes" aria-sort="none"><button type="button" class="sort">Size</button></th>
          <th data-key="updated" aria-sort="none"><button type="button" class="sort">Updated</button></th>
          <th><span class="sr">Actions</span></th>
        </tr></thead>
        <tbody id="pages"></tbody>
      </table>
      <datalist id="tag-options"></datalist>
    </section>

    <details id="tokens">
      <summary>API tokens <span>for scripts and tools such as Claude</span></summary>
      <p class="hint">A token can publish, list, tag and delete your pages. It cannot create tokens. Keep it secret; revoke it here if it leaks.</p>
      <form id="token-form" class="actions">
        <input id="token-label" aria-label="Token label" placeholder="label, e.g. claude" maxlength="60" autocomplete="off">
        <button>Create token</button>
      </form>
      <p id="token-new" hidden><span>Copy it now, it is shown once:</span> <code id="token-value"></code></p>
      <ul id="token-list"></ul>
    </details>
  </main>
</body>
</html>
